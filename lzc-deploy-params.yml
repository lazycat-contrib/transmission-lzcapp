params:
    - id: enable_auth
      type: bool
      name: "Enable Authentication"
      description: "Require a username and password for the web interface"
      default_value: "false"

    - id: admin_username
      type: string
      name: "Admin Username"
      optional: true
      description: "Username for the web interface"

    - id: admin_password
      type: secret
      name: "Admin Password"
      optional: true
      description: "Password for the web interface"

locales:
    zh:
        enable_auth:
            name: "启用认证"
            description: "启用认证"

        admin_username:
            name: "管理员登录名"
            description: "管理员的登录名"

        admin_password:
            name: "管理员密码"
            description: "管理员密码"
